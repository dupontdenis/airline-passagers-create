<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Airline{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand bg-light border-bottom">
      <div class="container">
        <div class="navbar-nav">
          <a class="nav-link" href="{% url 'flights:index' %}"> Vols </a>
          <a class="nav-link" href="{% url 'flights:airports' %}">
            Aéroports
          </a>
          <a class="nav-link" href="{% url 'flights:passengers' %}">
            Passagers
          </a>
        </div>
      </div>
    </nav>

    <div class="container py-3">
      <div class="d-flex align-items-center gap-2 mb-4 flex-wrap">
        <span class="text-secondary">Créer :</span>

        <a
          class="btn btn-outline-primary btn-sm"
          href="{% url 'flights:airport_create' %}"
        >
          Un aéroport
        </a>

        <a
          class="btn btn-outline-primary btn-sm"
          href="{% url 'flights:flight_create' %}"
        >
          Un vol
        </a>

        <a
          class="btn btn-outline-primary btn-sm"
          href="{% url 'flights:passenger_create' %}"
        >
          Un passager
        </a>
      </div>

      <main>{% block content %}{% endblock %}</main>
    </div>
  </body>
</html>
